services:
  - type: web
    name: learn-with-me-api
    plan: free
    env: node
    rootDir: .
    buildCommand: npm install && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: WEB_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: openai-compatible
      - key: OPENAI_BASE_URL
        value: https://shopmmo.id.vn/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: cx/gpt-5.5
      - key: OPENAI_FALLBACK_MODELS
        sync: false
      - key: UPLOAD_MAX_MB
        value: 6
