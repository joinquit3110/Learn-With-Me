services:
  - type: web
    name: learn-with-me-api
    plan: free
    env: node
    rootDir: .
    buildCommand: npm install && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: WEB_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: openai-compatible
      - key: OPENAI_BASE_URL
        value: https://api.vietapi.tech/v1
      - key: OPENAI_API_KEY
        value: sk-6x9A0KPEMDwKpKvrCW1NAHKXjvOSBXE8Lk7i40xg7fHZosHJ
      - key: OPENAI_MODEL
        value: gpt-5.5-xhigh
      - key: OPENAI_FALLBACK_MODELS
        value: ""
      - key: UPLOAD_MAX_MB
        value: 6
